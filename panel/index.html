<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Painel Vagante Promoções</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #262b36;
    --text: #e8ecf3;
    --muted: #93a0b4;
    --accent: #3b82f6;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(15, 17, 21, 0.95);
    backdrop-filter: blur(6px);
    z-index: 2;
  }
  header h1 { font-size: 17px; margin: 0; }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px;
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 14px; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
  .wide { grid-column: 1 / -1; }
  button {
    cursor: pointer;
    border: 1px solid var(--line);
    background: #1f2430;
    color: var(--text);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 14px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { border-color: var(--err); color: #fecaca; background: #2a1518; padding: 5px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: wait; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #11141a;
    color: var(--text);
    font-size: 14px;
  }
  .login { max-width: 360px; margin: 12vh auto; }
  .login .card { display: grid; gap: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .muted { color: var(--muted); font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .kpi { background: #11141a; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .kpi b { display: block; font-size: 18px; margin-top: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--err); }
  switch { }
  label.switch { position: relative; width: 46px; height: 26px; display: inline-block; flex: none; }
  label.switch input { opacity: 0; width: 0; height: 0; }
  label.switch span {
    position: absolute; inset: 0; border-radius: 999px; background: #3a4150; transition: .15s;
  }
  label.switch span::before {
    content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; top: 3px; left: 3px; transition: .15s;
  }
  label.switch input:checked + span { background: var(--ok); }
  label.switch input:checked + span::before { transform: translateX(20px); }
  .items { display: grid; gap: 8px; max-height: 420px; overflow: auto; }
  .item { display: flex; gap: 10px; align-items: center; background: #11141a; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .item img { width: 48px; height: 48px; object-fit: contain; background: #fff; border-radius: 6px; flex: none; }
  .item .info { min-width: 0; flex: 1; }
  .item .info b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .info span { font-size: 12px; color: var(--muted); }
  pre.logs {
    margin: 0; padding: 12px; background: #0b0d11; border: 1px solid var(--line); border-radius: 10px;
    font-size: 12px; line-height: 1.5; max-height: 320px; overflow: auto; white-space: pre-wrap;
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
  .comandos { display: grid; gap: 8px; }
  .cmd { background: #11141a; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; }
  .cmd b { color: var(--text); }
  .cmd.pending b { color: var(--warn); }
  .cmd.done b { color: var(--ok); }
  .cmd.error b { color: var(--err); }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #1f2430; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; font-size: 13px; display: none; z-index: 9;
  }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="login" class="login">
  <div class="card">
    <h1>Painel Vagante</h1>
    <p class="muted">Entre com o usuário admin criado no Firebase.</p>
    <input id="email" type="email" placeholder="e-mail" autocomplete="username" />
    <input id="password" type="password" placeholder="senha" autocomplete="current-password" />
    <button class="primary" id="btnLogin">Entrar</button>
    <p class="muted" id="loginMsg"></p>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <h1>Painel Vagante Promoções</h1>
    <div>
      <span class="muted" id="userEmail"></span>
      <button id="btnLogout">Sair</button>
    </div>
  </header>
  <main>
    <section class="card">
      <h2>Status</h2>
      <div class="kpis">
        <div class="kpi"><span class="muted">Internet</span><b id="kOnline">—</b></div>
        <div class="kpi"><span class="muted">Vistos</span><b id="kSeen">—</b></div>
        <div class="kpi"><span class="muted">Fila IG</span><b id="kQueue">—</b></div>
        <div class="kpi"><span class="muted">Vitrine</span><b id="kVitrine">—</b></div>
      </div>
      <div class="row"><span class="muted">Telegram</span><span id="tTelegram">—</span></div>
      <div class="row"><span class="muted">Instagram</span><span id="tInstagram">—</span></div>
      <div class="row"><span class="muted">Canais</span><span id="tListener">—</span></div>
      <div class="row"><span class="muted">Atualizado</span><span id="tUpdated">—</span></div>
    </section>

    <section class="card">
      <h2>Funções</h2>
      <div id="flags"></div>
    </section>

    <section class="card wide">
      <h2>Ações</h2>
      <div class="toolbar">
        <button class="primary" data-cmd="run_telegram">Rodar ciclo Telegram</button>
        <button data-cmd="run_instagram">Rodar ciclo Instagram</button>
      </div>
      <div class="comandos" id="comandos" style="margin-top:12px"></div>
    </section>

    <section class="card wide">
      <div class="row" style="padding-top:0;border-bottom:0">
        <h2 style="margin:0">Vitrine</h2>
        <label class="muted"><input type="checkbox" id="repostar" style="width:auto" /> permitir repostar o item removido</label>
      </div>
      <div class="items" id="vitrine"></div>
    </section>

    <section class="card wide">
      <h2>Logs</h2>
      <pre class="logs" id="logs"></pre>
    </section>
  </main>
</div>
<div id="toast"></div>

<script>
window.__painelIniciou = false;
setTimeout(function () {
  if (window.__painelIniciou) return;
  var el = document.getElementById("loginMsg");
  if (el && !el.textContent) {
    el.textContent = "O app.js não carregou. Abra /app.js direto no navegador " +
      "(se der 404, o deploy do painel está errado) e veja o console (F12).";
  }
}, 4000);
</script>
<script src="./firebase-config.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
